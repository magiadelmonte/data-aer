<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Resumen del vuelo | Estación de rastreo aéreo Magia del Monte</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- Paleta del sitio: `?skin=<id>` elige otra (aer_skin.css trae las dos). -->
<script>(function(){var s=new URLSearchParams(location.search).get('skin');if(s)document.documentElement.dataset.skin=s;})();</script>
<link rel="stylesheet" href="aer_skin.css">
<link rel="stylesheet" href="aer.css?v=20261128e">
</head>
<body class="rresumen">
<header class="rhead">
  <h1>ESTACIÓN DE RASTREO AÉREO MAGIA DEL MONTE</h1>
</header>

<main class="resumen">
  <!-- Izquierda (50%): mapa SAT del trayecto, el mismo del modal del listado. -->
  <section class="rmapa">
    <div id="mmap"></div>
    <div class="rpie">Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · © <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a></div>
  </section>

  <!-- Derecha (50%): arriba el FOV de la cámara; abajo la foto y los datos en 2x2. -->
  <div class="rcol">
    <section class="rfov" id="rfovbox">
      <div id="mfovbox"><canvas id="mfov"></canvas></div>
      <div class="rfovmsg" id="rfovmsg" hidden>Este vuelo pasó fuera del sector de la cámara.</div>
    </section>

    <section class="rdatos">
      <div class="rfoto" id="rfoto"></div>
      <div class="rbloque" id="raeronave"></div>
      <div class="rbloque" id="rvuelo"></div>
      <div class="rbloque" id="rruta"></div>
    </section>
  </div>
</main>

<div id="rmensaje" hidden></div>

<script>window.AST_BASE = "";</script>
<script src="aer_iconos.js?v=20261128e"></script>
<script src="aer_resumen_base.js?v=20261128e"></script>
<script src="ast_cielo.js?v=20261128e"></script>
<script src="aer_mapa.js?v=20261128e"></script>
<script src="aer_resumen.js?v=20261128e"></script>
</body>
</html>

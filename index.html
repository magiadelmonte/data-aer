<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Observatorio Uritorco</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* Mismo estilo visual que sat_camara.html (mismas variables que "css" de sat_config.json) */
  :root {
    --txt: #d4c9b0; --fondo: #000; --fondo-canvas: #05070a; --panel: #05070a;
    --borde: rgba(180,150,80,.45); --borde-suave: rgba(180,150,80,.25);
    --acento: #b49650; --ok: #4f8a6d; --tenue: #9a917c; --blanco: #fff; --no: #c0574d;
    --fila-alt: rgba(180,150,80,.05); --hover: rgba(180,150,80,.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', ui-monospace, Menlo, Consolas, monospace;
    background: var(--fondo); color: var(--txt); padding: 0 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  header { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 78px; margin: 0 -16px 24px; padding: 0 12px; border-bottom: 1px solid var(--borde); }
  header h1 {
    margin: 0; font-size: clamp(1.2rem, 4vw, 1.75rem); line-height: 1.2;
    letter-spacing: .14em; font-weight: 700; color: var(--txt); text-transform: uppercase;
  }
  header .subtitle { margin-top: 4px; font-size: clamp(.7rem, 1.6vw, .875rem); letter-spacing: .06em; color: var(--tenue); }
  header .rule { display: none; }
  #reloj { position: absolute; left: 12px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; text-align: left; line-height: 1.25; }
  #reloj .fecha, #reloj .hora { font-weight: 700; font-variant-numeric: tabular-nums; }
  /* Courier New es monoespaciada: fecha (10 car.) y hora (8 car.) ocupan el mismo ancho si hora = fecha x 10/8 */
  #reloj .fecha { font-size: 22px; }
  #reloj .hora { font-size: 27.5px; line-height: 1.1; color: inherit; }
  main { max-width: 1120px; margin: 0 auto; }
  .day { background: var(--panel); border: 1px solid var(--borde); margin: 0 0 22px; overflow: hidden; }
  .day-title {
    display: flex; align-items: center; margin: 0; padding: 8px 12px;
    border-bottom: 1px solid var(--borde); color: var(--blanco);
    font-size: .875rem; font-weight: 700; letter-spacing: .04em;
  }
  .day-title.toggle { cursor: pointer; user-select: none; }
  .day-title.toggle:hover { background: var(--hover); }
  .day-title.toggle::after { content: '\25B8'; margin-left: auto; color: var(--acento); font-size: 1.3rem; line-height: 1; }
  .day.open > .day-title.toggle::after { content: '\25BE'; }
  .day:not(.open) > .day-title { border-bottom: 0; }
  .day-body { display: none; }
  .day.open > .day-body { display: block; }
  .day-title.toggle:focus-visible { outline: 1px solid var(--acento); outline-offset: -3px; }
  .day.live { border-color: var(--ok); }
  .day.live .day-title { color: var(--ok); border-bottom-color: var(--ok); }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; margin-left: 10px; background: var(--ok); animation: livepulse 1.6s ease-out infinite; }
  @keyframes livepulse {
    0% { box-shadow: 0 0 0 0 rgba(79,138,109,.75); }
    70% { box-shadow: 0 0 0 9px rgba(79,138,109,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,138,109,0); }
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.5; }
  th, td { padding: 6px 12px; text-align: left; white-space: nowrap; }
  thead th { color: var(--tenue); font-size: 11px; font-weight: 400; letter-spacing: .09em; text-transform: uppercase; border-bottom: 1px solid var(--borde-suave); }
  tbody td { border-bottom: 1px solid var(--borde-suave); }
  .day.today tbody tr:nth-child(even) { background: var(--fila-alt); }
  .day.today tbody tr:hover, .day.live tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: none; }
  .hora, .dur { font-variant-numeric: tabular-nums; }
  .hora { font-weight: 700; color: var(--blanco); }
  .cat { display: block; color: var(--tenue); font-size: 11px; }
  .tot { color: var(--tenue); }
  .flag { vertical-align: middle; margin-right: 6px; width: 17px; height: 12px; object-fit: cover; border: 1px solid var(--borde); }
  .mark { font-weight: 700; }
  .yes { color: var(--ok); }
  .no { color: var(--no); }
  .na { color: var(--tenue); }
  .empty { margin: 0; padding: 16px; text-align: center; color: var(--tenue); font-size: .875rem; }
  .dir { font-weight: 700; letter-spacing: .02em; }
  tbody tr.has-traj { cursor: pointer; }
  /* ---- Modal de trayectoria ---- */
  #modal { position: fixed; inset: 0; z-index: 9999; display: none; align-items: center; justify-content: center; padding: 16px; background: rgba(0,0,0,.84); }
  #modal.on { display: flex; }
  .mbox { display: flex; flex-direction: column; width: min(92vmin, 900px); aspect-ratio: 1 / 1; max-width: 100%; max-height: 100%; background: var(--panel); border: 1px solid var(--borde); box-shadow: 0 0 46px rgba(0,0,0,.95); }
  .mhead { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--borde); color: var(--blanco); font-weight: 700; letter-spacing: .05em; font-size: 15px; }
  .mhead .msub { color: var(--tenue); font-weight: 400; letter-spacing: .03em; font-size: 13px; }
  .mx { margin-left: auto; padding: 3px 9px; background: none; border: 1px solid var(--borde-suave); color: var(--tenue); font: inherit; font-size: 14px; line-height: 1.1; cursor: pointer; }
  .mx:hover { color: var(--blanco); border-color: var(--acento); }
  #mmap { flex: 1 1 auto; width: 100%; min-height: 0; background: var(--fondo-canvas); }
  .mlab { color: var(--acento); font-size: 11px; letter-spacing: .06em; text-shadow: 0 0 4px #000; }
  .mplane { filter: drop-shadow(0 0 3px rgba(0,0,0,.95)); }
  footer { max-width: 1120px; margin: 8px auto 0; text-align: center; font-size: 11px; color: var(--tenue); letter-spacing: .04em; }
  footer a { color: var(--acento); }
  @media (max-width: 640px) {
    header h1 { letter-spacing: .08em; }
    header { padding-left: 112px; }
    #reloj .fecha { font-size: 16px; }
    #reloj .hora { font-size: 20px; }
    th, td { padding: 6px 8px; font-size: 12px; }
    .day-body { overflow-x: auto; }
  }
</style>
</head>
<body>
<header>
  <div id="reloj"></div>
  <h1>Observatorio Uritorco</h1>
  <div class="subtitle">Registro de Aeronaves</div>
  <div class="rule"></div>
</header>
<main>
  <div id="live"></div>
  <div id="reportes"></div>
  <div id="days"></div>
</main>
<footer id="foot"></footer>

<div id="modal" aria-hidden="true">
  <div class="mbox" role="dialog" aria-modal="true" aria-labelledby="mtit">
    <div class="mhead"><span id="mtit"></span><span class="msub" id="msub"></span>
      <button class="mx" id="mx" title="Cerrar (Esc)">✕</button></div>
    <div id="mmap"></div>
  </div>
</div>

<script>
// El index.html es siempre el mismo: los datos se cargan de semana.json.
let DATA = { flights: [], n: 0, window_days: 5, updated_iso: '', today: null };

const WEEKDAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto',
  'Septiembre','Octubre','Noviembre','Diciembre'];
const CARD_ABREV = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];

const toRad = d => d * Math.PI / 180;
const cardAbrev = deg => (deg == null ? null
  : CARD_ABREV[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16]);

function bearing(lat1, lon1, lat2, lon2){
  const f1 = toRad(lat1), f2 = toRad(lat2), dl = toRad(lon2 - lon1);
  const y = Math.sin(dl) * Math.cos(f2);
  const x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function distKm(lat1, lon1, lat2, lon2){
  const R = 6371, dφ = toRad(lat2 - lat1), dλ = toRad(lon2 - lon1);
  const a = Math.sin(dφ/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dλ/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function hourMin(iso){
  const m = /T(\d{2}):(\d{2})/.exec(iso || '');
  return m ? m[1] + ':' + m[2] : '';
}
function dayKey(iso){ return (iso || '').slice(0, 10); }
function fmtDay(key){
  if(key === DATA.today) return 'HOY';
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key);
  if(!m) return key;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' de ' +
         MONTHS[d.getMonth()] + ' de ' + d.getFullYear();
}
function capillaInfo(f){
  const pts = f.path || [];
  if(pts.length === 0 || DATA.center_lat == null)
    return '<span class="na">—</span>';
  let best = Infinity;
  for(const p of pts){
    const d = distKm(p.lat, p.lon, DATA.center_lat, DATA.center_lon);
    if(d < best) best = d;
  }
  const km = best.toFixed(1) + ' km';
  if(best <= DATA.r1_km)
    return '<span class="mark yes">✓</span> <span class="yes">' + km + '</span>';
  return '<span class="mark no">✗</span> <span class="no">' + km + '</span>';
}
function durHMS(sec){
  if(sec == null) return '';
  sec = Math.round(sec);
  const p = n => String(n).padStart(2, '0');
  return p(Math.floor(sec/3600)) + ':' + p(Math.floor((sec%3600)/60)) + ':' + p(sec%60);
}
function orientInfo(f){
  const pts = f.path || [];
  if(pts.length < 2) return '<span class="na">—</span>';
  const a = pts[0], b = pts[pts.length - 1];
  const brg = bearing(a.lat, a.lon, b.lat, b.lon);
  return cardAbrev((brg + 180) % 360) + '→' + cardAbrev(brg);
}
function tipoCell(f){
  let tipo = f.type_label || f.icao_type || '';
  let cat = f.ac_type_label || '';
  if(!tipo){ tipo = cat; cat = ''; }
  if(cat) tipo += '<span class="cat">' + cat + '</span>';
  return tipo;
}

const HEAD = '<tr><th>Hora</th><th>Vuelo</th><th>Matrícula</th><th>Aeronave</th>' +
  '<th>País</th><th>Visible</th><th>Trayecto</th><th>Duración</th></tr>';

const rowKey = f => (f.callsign || f.icao24 || '') + '|' + (f.ts_start_iso || '');
function rowHtml(f, live){
  const flag = f.country
    ? '<img class="flag" src="https://flagcdn.com/w40/' + f.country +
      '.png" onerror="this.style.display=\'none\'">' : '';
  const pais = f.country_name_spa || f.country_name_eng || f.country || '';
  const dur = live
    ? durHMS(Math.max(0, Math.floor(Date.now() / 1000 - (f.ts_start || 0))))
    : durHMS(f.duration_sec);
  return '<tr data-k="' + rowKey(f).replace(/"/g, '&quot;') + '">' +
    '<td class="hora">' + hourMin(f.ts_start_iso) + '</td>' +
    '<td>' + (f.callsign || f.icao24 || '') + '</td>' +
    '<td>' + (f.registration || '') + '</td>' +
    '<td>' + tipoCell(f) + '</td>' +
    '<td>' + flag + pais + '</td>' +
    '<td>' + capillaInfo(f) + '</td>' +
    '<td class="dir">' + orientInfo(f) + '</td>' +
    '<td class="dur">' + dur + '</td>' +
    '</tr>';
}

function daySection(key, flights, open){
  const rows = flights.map(f => rowHtml(f, false)).join('');
  const secCls = 'day' + (open ? ' open' : '') + (key === DATA.today ? ' today' : '');
  return '<section class="' + secCls + '" data-key="' + key + '"><h2 class="day-title toggle">' + fmtDay(key) + '</h2>' +
    '<div class="day-body"><table><thead>' + HEAD + '</thead>' +
    '<tbody>' + rows + '</tbody></table></div></section>';
}

let liveData = { flights: [] };
function renderLive(){
  const box = document.getElementById('live');
  const flights = (liveData && liveData.flights) || [];
  const body = flights.length
    ? '<table><thead>' + HEAD + '</thead><tbody>' +
        flights.map(f => rowHtml(f, true)).join('') + '</tbody></table>'
    : '<p class="empty">No hay vuelos sobrevolando Capilla del Monte en este momento</p>';
  box.innerHTML = '<section class="day open live">' +
    '<h2 class="day-title">Vuelos actuales<span class="live-dot"></span></h2>' +
    '<div class="day-body">' + body + '</div></section>';
  marcarFilas();
}
function pollLive(){
  fetch('r1_live.json?_=' + Date.now(), {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { liveData = j || { flights: [] }; renderLive(); })
    .catch(() => {});
}

// Bloque "Totales semanales": máximos por categoría (horario/aerolínea/tipo/país/
// trayecto) de los últimos días. Columnas propias (sin Matrícula/Visible/Duración, que
// no aplican): Hora | Vuelo | Aeronave | País | Trayecto. La cantidad va entre
// paréntesis al lado del dato.
const HEAD_REPORTES = '<tr><th>Hora</th><th>Vuelo</th><th>Aeronave</th>' +
  '<th>País</th><th>Trayecto</th></tr>';
let repData = { tops: {}, n: 0 };
function topCell(t){
  if(!t || t.flights == null) return '<span class="na">—</span>';
  const label = t.label || t.key || '';
  return label + ' <span class="tot">(' + t.flights + ')</span>';
}
function renderReportes(){
  const box = document.getElementById('reportes');
  const tops = (repData && repData.tops) || {};
  const has = tops.airline || tops.country || tops.type || tops.track || tops.hour;
  const dash = '<span class="na">—</span>';
  const ctry = tops.country;
  const paisCell = (ctry && ctry.key)
    ? '<img class="flag" src="https://flagcdn.com/w40/' + ctry.key +
      '.png" onerror="this.style.display=\'none\'">' +
      (ctry.label || ctry.key) + ' <span class="tot">(' + ctry.flights + ')</span>'
    : dash;
  const body = has
    ? '<tr>' +
        '<td class="hora">' + topCell(tops.hour) + '</td>' +
        '<td>' + topCell(tops.airline) + '</td>' +
        '<td>' + topCell(tops.type) + '</td>' +
        '<td>' + paisCell + '</td>' +
        '<td class="dir">' + topCell(tops.track) + '</td>' +
      '</tr>'
    : '<tr><td colspan="5"><span class="na">Sin datos de totales.</span></td></tr>';
  box.innerHTML = '<section class="day open">' +
    '<h2 class="day-title">Totales semanales</h2>' +
    '<div class="day-body"><table><thead>' + HEAD_REPORTES + '</thead>' +
    '<tbody>' + body + '</tbody></table></div></section>';
}
function pollReportes(){
  fetch('reportes.json?_=' + Date.now(), {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { repData = j || { tops: {} }; renderReportes(); })
    .catch(() => {});
}

function render(){
  // Conservar el estado abierto/cerrado de cada día entre refrescos. El estado
  // actual del DOM manda; si un día no está en el DOM (primera vez que aparece),
  // el día de hoy arranca abierto y el resto cerrado.
  const openStates = {};
  document.querySelectorAll('#days .day[data-key]').forEach(sec => {
    openStates[sec.dataset.key] = sec.classList.contains('open');
  });
  const groups = {};
  (DATA.flights || []).forEach(f => {
    const k = dayKey(f.ts_start_iso);
    (groups[k] = groups[k] || []).push(f);
  });
  const keys = Object.keys(groups).sort().reverse();   // día más reciente primero
  const days = document.getElementById('days');
  days.innerHTML = keys.length
    ? keys.map(k => {
        groups[k].sort((a, b) => (b.ts_start || 0) - (a.ts_start || 0));
        const open = (k in openStates) ? openStates[k] : (k === DATA.today);
        return daySection(k, groups[k], open);
      }).join('')
    : '<p class="na" style="text-align:center">Sin vuelos registrados.</p>';
  const meta = DATA.n
    ? 'Actualizado: ' + DATA.updated_iso + ' · ' + DATA.n +
      ' vuelos · últimos ' + DATA.window_days + ' días'
    : 'Sin vuelos';
  document.getElementById('foot').innerHTML = meta +
    ' · <a href="https://www.youtube.com/@MagiaDelMonte">Observatorio Uritorco</a>';
  marcarFilas();
}

document.getElementById('days').addEventListener('click', e => {
  const t = e.target.closest('.day-title.toggle');
  if(t) t.parentElement.classList.toggle('open');
});

// La tabla semanal se recarga de semana.json (index.html no se regenera).
const WEEK_REFRESH_MS = 300000;   // 5 min
function loadWeek(first){
  fetch('semana.json?_=' + Date.now(), {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { DATA = j || { flights: [] }; render(); })
    .catch(() => {
      if(first){
        document.getElementById('days').innerHTML =
          '<p class="na" style="text-align:center">No se pudieron cargar los datos (semana.json).</p>';
        document.getElementById('foot').textContent = '';
      }
    });
}
function tickReloj(){
  const d = new Date();
  document.getElementById('reloj').innerHTML = '<div class="fecha">' + d.toLocaleDateString('es-AR') +
    '</div><div class="hora">' + d.toLocaleTimeString('es-AR', {hour12: false}) + '</div>';
}
tickReloj(); setInterval(tickReloj, 1000);

loadWeek(true);
setInterval(() => loadWeek(false), WEEK_REFRESH_MS);

// Bloque "Reportes": se refresca junto con la tabla semanal y con el bloque vivo.
const _p = new URLSearchParams(location.search);
const REPORT_REFRESH_MS = Math.max(10000, parseInt(_p.get('report') || '60000', 10) || 60000);
pollReportes();
setInterval(pollReportes, REPORT_REFRESH_MS);

// Bloque "Vuelos actuales": recarga r1_live.json cada LIVE_REFRESH_MS (def. 60 s).
// Se puede ajustar con ?live=<ms> en la URL (mínimo 10 s).
const LIVE_REFRESH_MS = Math.max(10000, parseInt(_p.get('live') || '60000', 10) || 60000);
pollLive();
setInterval(pollLive, LIVE_REFRESH_MS);

// Bloque "Reportes": se recarga junto con la tabla semanal (misma ventana de días).
pollReportes();

// ============================================================
// Modal de trayectoria (vuelos de hoy): mapa físico + 3 anillos
// ============================================================
let TRAJ = { flights: [], rings_km: [25, 50, 65] };
const TKEY = {};                       // k -> vuelo con trayectoria
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const ESRI_RELIEF = ESRI + 'World_Shaded_Relief/MapServer/tile/{z}/{y}/{x}';
const ESRI_LABELS = ESRI + 'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}';
const AZ_MIN = 13, AZ_MAX = 65;      // porción de "pizza" (azimut, grados)
const ICONS = {   // mismos íconos que aer/web/mapa.html (nariz hacia arriba)
  airliner:   { color: '#e8e8e8', rot: true,
    svg: '<path d="M12 1.6 L13.1 7.6 L22.4 13.1 L22.4 15.2 L13.1 12.3 L12.7 17.2 L15.9 20.2 L15.9 21.9 L12 20.4 L8.1 21.9 L8.1 20.2 L11.3 17.2 L10.9 12.3 L1.6 15.2 L1.6 13.1 L10.9 7.6 Z"/>' },
  bizjet:     { color: '#d4c9b0', rot: true,
    svg: '<path d="M12 2 L12.9 8.6 L20 13.4 L20 15 L12.9 12.6 L12.6 16.4 L14.8 18.6 L14.8 19.6 L12 18.4 L9.2 19.6 L9.2 18.6 L11.4 16.4 L11.1 12.6 L4 15 L4 13.4 L11.1 8.6 Z"/>'
       + '<rect x="9.7" y="13.1" width="1.3" height="3.2" rx="0.65"/><rect x="13" y="13.1" width="1.3" height="3.2" rx="0.65"/>' },
  cargo:      { color: '#c8a15a', rot: true,
    svg: '<path d="M12 1.6 L13.3 7.2 L22.4 12.9 L22.4 15 L13.3 12.2 L13.2 18.6 L16.2 20.4 L16.2 22 L12 20.7 L7.8 22 L7.8 20.4 L10.8 18.6 L10.7 12.2 L1.6 15 L1.6 12.9 L10.7 7.2 Z"/>' },
  military:   { color: '#d05a5a', rot: true,
    svg: '<path d="M12 1.5 L12.6 10 L21.5 16.5 L21.5 18 L12.6 14.2 L12.6 17.6 L15.4 20.2 L15.4 21.6 L12 20.3 L8.6 21.6 L8.6 20.2 L11.4 17.6 L11.4 14.2 L2.5 18 L2.5 16.5 L11.4 10 Z"/>' },
  light:      { color: '#a9c6d8', rot: true,
    svg: '<rect x="8.6" y="2.6" width="6.8" height="0.9" rx="0.45"/>'
       + '<path d="M12 3.4 L12.7 8.5 L19.6 12 L19.6 13.3 L12.7 11.4 L12.4 16 L14.6 18 L14.6 18.9 L12 17.9 L9.4 18.9 L9.4 18 L11.6 16 L11.3 11.4 L4.4 13.3 L4.4 12 L11.3 8.5 Z"/>' },
  turboprop:  { color: '#b6c9a5', rot: true,
    svg: '<rect x="8.6" y="2.4" width="6.8" height="0.9" rx="0.45"/>'
       + '<path d="M12 3.4 L12.7 8.5 L19.6 12 L19.6 13.3 L12.7 11.4 L12.4 16 L14.6 18 L14.6 18.9 L12 17.9 L9.4 18.9 L9.4 18 L11.6 16 L11.3 11.4 L4.4 13.3 L4.4 12 L11.3 8.5 Z"/>'

let MMAP = null, MTRAJ = null;

function marcarFilas(){
  document.querySelectorAll('#days tr[data-k], #live tr[data-k]').forEach(tr => {
    const has = !!TKEY[tr.dataset.k];
    tr.classList.toggle('has-traj', has);
    tr.title = has ? 'clic para ver el mapa del trayecto' : '';
  });
}

function destino(lat, lon, brg, km){
  // Punto de destino por rumbo/distancia (fórmula directa sobre esfera).
  const R = 6371, d = km / R, b = toRad(brg);
  const f1 = toRad(lat), l1 = toRad(lon);
  const f2 = Math.asin(Math.sin(f1) * Math.cos(d) + Math.cos(f1) * Math.sin(d) * Math.cos(b));
  const l2 = l1 + Math.atan2(Math.sin(b) * Math.sin(d) * Math.cos(f1),
                             Math.cos(d) - Math.sin(f1) * Math.sin(f2));
  return [f2 * 180 / Math.PI, ((l2 * 180 / Math.PI + 540) % 360) - 180];
}

function initMapa(){
  const lat = TRAJ.center_lat, lon = TRAJ.center_lon;
  const rings = TRAJ.rings_km || [25, 50, 65];
  const m = L.map('mmap', {zoomControl: false, attributionControl: false,
    preferCanvas: true, zoomSnap: 0.1, zoomDelta: 0.5});
  // Fondo físico, muy oscuro.
  L.tileLayer(ESRI_RELIEF, {maxZoom: 13}).addTo(m);
  m.getPane('tilePane').style.filter =
    'sepia(.45) saturate(.9) brightness(.22) contrast(1.45) hue-rotate(-8deg)';
  // Nombres de pueblos, rutas, etc.: capa de referencia invertida (texto claro).
  m.createPane('labels');
  m.getPane('labels').style.zIndex = 450;
  m.getPane('labels').style.pointerEvents = 'none';
  L.tileLayer(ESRI_LABELS, {pane: 'labels', maxZoom: 13}).addTo(m);
  m.getPane('labels').style.filter = 'grayscale(1) brightness(0) invert(1)';
  m.getPane('labels').style.opacity = '.9';
  const c = [lat, lon];
  // Porción de pizza (13°-65° de azimut) hasta el radio mayor: capa más oscura.
  const sector = [c];
  for(let a = AZ_MIN; a <= AZ_MAX; a += 2) sector.push(destino(lat, lon, a, rings[2]));
  sector.push(destino(lat, lon, AZ_MAX, rings[2]));
  L.polygon(sector, {color: 'transparent', weight: 0, fillColor: '#000',
    fillOpacity: .3, interactive: false}).addTo(m);
  // Anillos punteados en blanco (25 / 50 / 65 km).
  rings.forEach((r, i) => {
    L.circle(c, {radius: r * 1000, color: '#fff', weight: i ? 0.55 : 0.75,
      opacity: i ? .55 : .8, dashArray: '6,6', fill: false,
      interactive: false}).addTo(m);
    const ang = Math.PI;      // etiqueta de distancia hacia el oeste
    const dLat = (r * 1000 / 6371000) * (180 / Math.PI);
    const dLon = dLat / Math.cos(lat * Math.PI / 180);
    L.marker([lat + dLat * Math.sin(ang), lon + dLon * Math.cos(ang)], {
      interactive: false,
      icon: L.divIcon({className: '', html: '<span class="mlab">' + r + ' km</span>',
                       iconSize: [44, 12]}),
    }).addTo(m);
  });
  L.circleMarker(c, {radius: 3, color: '#fff', weight: 2, fillColor: '#fff',
    fillOpacity: 1, interactive: false}).addTo(m);
  MTRAJ = L.layerGroup().addTo(m);
  m.fitBounds(L.latLng(lat, lon).toBounds(rings[2] * 2000), {padding: [18, 18]});
  return m;
}

function iconHTML(key, deg){
  const spec = ICONS[key] || ICONS.unknown;
  const rot = spec.rot ? 'transform:rotate(' + deg.toFixed(0) + 'deg);' : '';
  return '<div class="mplane" style="' + rot + '"><svg viewBox="0 0 24 24" ' +
    'width="30" height="30" fill="' + spec.color + '" color="' + spec.color + '" ' +
    'stroke="#000" stroke-width=".55" stroke-linejoin="round">' + spec.svg +
    '</svg></div>';
}

function rumboFinal(lls){
  const b = lls[lls.length - 1];
  for(let i = lls.length - 2; i >= 0; i--){
    const a = lls[i];
    if(Math.abs(a[0] - b[0]) > 1e-5 || Math.abs(a[1] - b[1]) > 1e-5)
      return bearing(a[0], a[1], b[0], b[1]);
  }
  return 0;
}

function abrirTrayecto(k){
  const f = TKEY[k];
  if(!f || TRAJ.center_lat == null) return;
  document.getElementById('mtit').textContent = f.callsign || '';
  document.getElementById('msub').textContent = hourMin(f.ts_start_iso) + ' hs';
  document.getElementById('modal').classList.add('on');
  document.body.style.overflow = 'hidden';
  if(!MMAP) MMAP = initMapa();
  MMAP.invalidateSize();
  MTRAJ.clearLayers();
  const lls = f.path.map(p => [p[0], p[1]]);
  L.polyline(lls, {color: '#b49650', weight: 2.4, opacity: .95,
    interactive: false}).addTo(MTRAJ);
  L.circleMarker(lls[0], {radius: 4, color: '#4f8a6d', weight: 2, fillColor: '#000',
    fillOpacity: 1, interactive: false}).addTo(MTRAJ);
  const brg = rumboFinal(lls);
  L.marker(lls[lls.length - 1], {interactive: false, zIndexOffset: 1000,
    icon: L.divIcon({className: '', iconSize: [30, 30], iconAnchor: [15, 15],
      html: iconHTML(f.icon, brg)}),
  }).addTo(MTRAJ);
}

function cerrarModal(){
  document.getElementById('modal').classList.remove('on');
  document.body.style.overflow = '';
}

document.getElementById('mx').addEventListener('click', cerrarModal);
document.getElementById('modal').addEventListener('click', e => {
  if(e.target.id === 'modal') cerrarModal();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') cerrarModal();
});
document.addEventListener('click', e => {
  const tr = e.target.closest('tr[data-k]');
  if(tr && TKEY[tr.dataset.k]) abrirTrayecto(tr.dataset.k);
});

function loadTrayectos(){
  fetch('trayectos.json?_=' + Date.now(), {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => {
      TRAJ = j || {flights: []};
      Object.keys(TKEY).forEach(k => delete TKEY[k]);
      (TRAJ.flights || []).forEach(f => { TKEY[f.k] = f; });
      marcarFilas();
    })
    .catch(() => {});
}
loadTrayectos();
setInterval(loadTrayectos, WEEK_REFRESH_MS);
</script>

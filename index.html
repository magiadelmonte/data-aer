<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observatorio Uritorco</title>
<style>
  :root {
    --bg: #eef2ee; --panel: #ffffff; --ink: #14201a; --muted: #5c6b62;
    --line: #d5e2d8; --green: #1a7f37; --green-dark: #0f5132;
    --row-alt: #f6faf6; --hover: #eef6ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    background-color: var(--bg);
    /* Motivo "radar": anillos concéntricos tenues desde el centro superior. */
    background-image: repeating-radial-gradient(circle at 50% -8%,
      transparent 0, transparent 84px,
      rgba(26,127,55,0.07) 84px, rgba(26,127,55,0.07) 85.5px);
    background-attachment: fixed;
    color: var(--ink); padding: 28px 16px 40px;
    -webkit-font-smoothing: antialiased;
  }
  header { text-align: center; margin: 8px auto 26px; }
  header h1 {
    width: 60%; min-width: 260px; margin: 0 auto;
    font-size: clamp(1.5rem, 4.6vw, 3.1rem); line-height: 1.1;
    letter-spacing: .14em; font-weight: 700; color: var(--green-dark);
    text-transform: uppercase; text-shadow: 0 1px 0 #fff;
  }
  header .subtitle {
    margin-top: 10px; font-size: clamp(.7rem, 1.6vw, .95rem);
    letter-spacing: .28em; text-transform: uppercase; color: var(--muted);
  }
  header .rule {
    width: 60%; min-width: 260px; height: 2px; margin: 16px auto 0;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
  }
  main { max-width: 1120px; margin: 0 auto; }
  .day {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; margin: 0 0 26px;
    box-shadow: 0 1px 3px rgba(15,81,50,0.08), 0 8px 24px rgba(15,81,50,0.05);
  }
  .day-title {
    display: flex; align-items: center; margin: 0; padding: 11px 16px;
    background: linear-gradient(90deg, var(--green-dark), var(--green));
    color: #eafff2; font-size: .95rem; font-weight: 700; letter-spacing: .06em;
  }
  .day-title.toggle { cursor: pointer; user-select: none; }
  .day-title.toggle:hover { filter: brightness(1.08); }
  .day-title.toggle::after {
    content: '▾'; margin-left: auto; font-size: 1rem; line-height: 1;
  }
  .day.open > .day-title.toggle::after { content: '▴'; }
  .day-body { display: none; }
  .day.open > .day-body { display: block; }
  .day-title.toggle:focus-visible { outline: 2px solid #eafff2; outline-offset: -3px; }
  .day.live { border-color: #a9d8b8; }
  .day.live .day-title { background: linear-gradient(90deg, #0a6b2e, #23a94f); }
  .live-dot {
    width: 9px; height: 9px; border-radius: 50%; margin-left: 10px;
    background: #eafff2; animation: livepulse 1.6s ease-out infinite;
  }
  @keyframes livepulse {
    0% { box-shadow: 0 0 0 0 rgba(234,255,242,.75); }
    70% { box-shadow: 0 0 0 9px rgba(234,255,242,0); }
    100% { box-shadow: 0 0 0 0 rgba(234,255,242,0); }
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; }
  thead th {
    background: #eaf4ec; color: var(--green-dark); font-size: 10.5px;
    letter-spacing: .09em; text-transform: uppercase; border-bottom: 1px solid var(--line);
  }
  tbody td { border-bottom: 1px solid #eef2ee; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--hover); }
  tbody tr:last-child td { border-bottom: none; }
  .hora, .dur { font-variant-numeric: tabular-nums; }
  .hora { font-weight: 600; }
  .cat { display: block; color: #8a978f; font-size: 11px; }
  .flag { vertical-align: middle; margin-right: 6px; width: 17px; height: 12px;
    object-fit: cover; border: 1px solid #cfd9d2; border-radius: 1px; }
  .mark { font-weight: 700; }
  .yes { color: var(--green); }
  .no { color: #101010; }
  .na { color: #9aa69e; }
  .empty { margin: 0; padding: 16px; text-align: center; color: var(--muted);
    font-size: .9rem; letter-spacing: .02em; }
  .dir { font-weight: 600; letter-spacing: .02em; }
  footer { max-width: 1120px; margin: 8px auto 0; text-align: center;
    font-size: 11px; color: var(--muted); letter-spacing: .04em; }
  footer a { color: var(--green-dark); }
  @media (max-width: 640px) {
    header h1 { width: 90%; letter-spacing: .08em; }
    header .subtitle { letter-spacing: .14em; }
    th, td { padding: 7px 8px; font-size: 12px; }
  }
</style>
</head>

<header>

  <div class="subtitle">Registro histórico semanal de vuelos</div>
  <div class="rule"></div>
</header>
<main>
  <div id="live"></div>
  <div id="days"></div>
</main>
<footer id="foot"></footer>

const WEEKDAYS = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MONTHS = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto',
  'Septiembre','Octubre','Noviembre','Diciembre'];
const CARD_ABREV = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];

const toRad = d => d * Math.PI / 180;
const cardAbrev = deg => (deg == null ? null
  : CARD_ABREV[Math.round(((deg % 360) + 360) % 360 / 22.5) % 16]);

function bearing(lat1, lon1, lat2, lon2){
  const f1 = toRad(lat1), f2 = toRad(lat2), dl = toRad(lon2 - lon1);
  const y = Math.sin(dl) * Math.cos(f2);
  const x = Math.cos(f1) * Math.sin(f2) - Math.sin(f1) * Math.cos(f2) * Math.cos(dl);
  return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
}
function distKm(lat1, lon1, lat2, lon2){
  const R = 6371, dφ = toRad(lat2 - lat1), dλ = toRad(lon2 - lon1);
  const a = Math.sin(dφ/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dλ/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}
function hourMin(iso){
  const m = /T(\d{2}):(\d{2})/.exec(iso || '');
  return m ? m[1] + ':' + m[2] : '';
}
function dayKey(iso){ return (iso || '').slice(0, 10); }
function fmtDay(key){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key);
  if(!m) return key;
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return WEEKDAYS[d.getDay()] + ' ' + d.getDate() + ' de ' +
         MONTHS[d.getMonth()] + ' de ' + d.getFullYear();
}
function capillaInfo(f){
  const pts = f.path || [];
  if(pts.length === 0 || DATA.center_lat == null)
    return '<span class="na">—</span>';
  let best = Infinity;
  for(const p of pts){
    const d = distKm(p.lat, p.lon, DATA.center_lat, DATA.center_lon);
    if(d < best) best = d;
  }
  const km = best.toFixed(1) + ' km';
  if(best <= DATA.r1_km)
    return '<span class="mark yes">✓</span> <span class="yes">' + km + '</span>';
  return '<span class="mark no">✗</span> <span class="no">' + km + '</span>';
}
function durHMS(sec){
  if(sec == null) return '';
  sec = Math.round(sec);
  const p = n => String(n).padStart(2, '0');
  return p(Math.floor(sec/3600)) + ':' + p(Math.floor((sec%3600)/60)) + ':' + p(sec%60);
}
function orientInfo(f){
  const pts = f.path || [];
  if(pts.length < 2) return '<span class="na">—</span>';
  const a = pts[0], b = pts[pts.length - 1];
  const brg = bearing(a.lat, a.lon, b.lat, b.lon);
  return cardAbrev((brg + 180) % 360) + '→' + cardAbrev(brg);
}
function tipoCell(f){
  let tipo = f.type_label || f.icao_type || '';
  let cat = f.ac_type_label || '';
  if(!tipo){ tipo = cat; cat = ''; }
  if(cat) tipo += '<span class="cat">' + cat + '</span>';
  return tipo;
}

const HEAD = '<tr><th>Hora</th><th>Vuelo</th><th>Matrícula</th><th>Aeronave</th>' +
  '<th>País</th><th>Visible</th><th>Trayecto</th><th>Duración</th></tr>';

function rowHtml(f, live){
  const flag = f.country
    ? '<img class="flag" src="https://flagcdn.com/w40/' + f.country +
      '.png" onerror="this.style.display=\'none\'">' : '';
  const pais = f.country_name_spa || f.country_name_eng || f.country || '';
  const dur = live
    ? durHMS(Math.max(0, Math.floor(Date.now() / 1000 - (f.ts_start || 0))))
    : durHMS(f.duration_sec);
  return '<tr>' +
    '<td class="hora">' + hourMin(f.ts_start_iso) + '</td>' +
    '<td>' + (f.callsign || f.icao24 || '') + '</td>' +
    '<td>' + (f.registration || '') + '</td>' +
    '<td>' + tipoCell(f) + '</td>' +
    '<td>' + flag + pais + '</td>' +
    '<td>' + capillaInfo(f) + '</td>' +
    '<td class="dir">' + orientInfo(f) + '</td>' +
    '<td class="dur">' + dur + '</td>' +
    '</tr>';
}

function daySection(key, flights){
  const rows = flights.map(f => rowHtml(f, false)).join('');
  const isToday = key === DATA.today;
  const secCls = 'day' + (isToday ? ' open' : '');
  const hCls = 'day-title' + (isToday ? '' : ' toggle');
  return '<section class="' + secCls + '"><h2 class="' + hCls + '">' + fmtDay(key) + '</h2>' +
    '<div class="day-body"><table><thead>' + HEAD + '</thead>' +
    '<tbody>' + rows + '</tbody></table></div></section>';
}

let liveData = { flights: [] };
function renderLive(){
  const box = document.getElementById('live');
  const flights = (liveData && liveData.flights) || [];
  const body = flights.length
    ? '<table><thead>' + HEAD + '</thead><tbody>' +
        flights.map(f => rowHtml(f, true)).join('') + '</tbody></table>'
    : '<p class="empty">No hay vuelos sobrevolando Capilla del Monte en este momento</p>';
  box.innerHTML = '<section class="day open live">' +
    '<h2 class="day-title">Vuelos actuales<span class="live-dot"></span></h2>' +
    '<div class="day-body">' + body + '</div></section>';
}
function pollLive(){
  fetch('r1_live.json?_=' + Date.now(), {cache: 'no-store'})
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(j => { liveData = j || { flights: [] }; renderLive(); })
    .catch(() => {});
}

function render(){
  const groups = {};
  (DATA.flights || []).forEach(f => {
    const k = dayKey(f.ts_start_iso);
    (groups[k] = groups[k] || []).push(f);
  });
  const keys = Object.keys(groups).sort().reverse();   // día más reciente primero
  const days = document.getElementById('days');
  days.innerHTML = keys.length
    ? keys.map(k => {
        groups[k].sort((a, b) => (b.ts_start || 0) - (a.ts_start || 0));
        return daySection(k, groups[k]);
      }).join('')
    : '<p class="na" style="text-align:center">Sin vuelos registrados.</p>';
  days.addEventListener('click', e => {
    const t = e.target.closest('.day-title.toggle');
    if(t) t.parentElement.classList.toggle('open');
  });
  const meta = DATA.n
    ? 'Actualizado: ' + DATA.updated_iso + ' · ' + DATA.n +
      ' vuelos · últimos ' + DATA.window_days + ' días'
    : 'Sin vuelos';
  document.getElementById('foot').innerHTML = meta +
    ' · <a href="https://www.youtube.com/@MagiaDelMonte">Observatorio Uritorco</a>';
}
render();

// Bloque "Vuelos actuales": recarga r1_live.json cada LIVE_REFRESH_MS (def. 60 s).
// Se puede ajustar con ?live=<ms> en la URL (mínimo 10 s).
const _p = new URLSearchParams(location.search);
const LIVE_REFRESH_MS = Math.max(10000, parseInt(_p.get('live') || '60000', 10) || 60000);
pollLive();
setInterval(pollLive, LIVE_REFRESH_MS);
</script>
